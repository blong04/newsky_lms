name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Chọn môi trường deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Chạy test bằng Maven trên runner
  # ────────────────────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven tests
        working-directory: ./backend
        run: mvn -B test

  # ────────────────────────────────────────────────────────────
  # Job 2: Build Docker image và push lên DockerHub
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker image
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_full: ${{ steps.vars.outputs.image_full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag (short commit SHA)
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          USER_NAME="${{ secrets.DOCKERHUB_USERNAME }}"
          PROJECT_NAME=$(echo "${{ vars.DOCKERHUB_PROJECT_NAME }}" | tr '[:upper:]' '[:lower:]')

          # Fallback nếu DOCKERHUB_PROJECT_NAME bị rỗng trên UI GitHub
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="newsky-backend"
          fi

          IMAGE_FULL="${USER_NAME}/${PROJECT_NAME}:${SHORT_SHA}"

          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_full=${IMAGE_FULL}" >> "$GITHUB_OUTPUT"

          echo "DEBUG: image_tag is -> ${SHORT_SHA}"
          echo "DEBUG: image_full is -> ${IMAGE_FULL}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_full }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_PROJECT_NAME || 'newsky-backend' }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Job 3: SSH vào EC2, deploy container và update SSM Parameter
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    env:
      # Secrets
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      APP_PAYMENT_BANK_ACCOUNT_NUMBER: ${{ secrets.APP_PAYMENT_BANK_ACCOUNT_NUMBER }}
      APP_PAYMENT_BANK_ACCOUNT_NAME: ${{ secrets.APP_PAYMENT_BANK_ACCOUNT_NAME }}
      APP_PAYMENT_MOMO_WALLET_ID: ${{ secrets.APP_PAYMENT_MOMO_WALLET_ID }}
      # Variables
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      HOST_PORT: ${{ vars.HOST_PORT }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      ENV_FILE_PATH: ${{ vars.ENV_FILE_PATH }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SSM_PARAMETER_NAME: ${{ vars.SSM_PARAMETER_NAME }}
      PORT: ${{ vars.PORT }}
      MAIL_HOST: ${{ vars.MAIL_HOST }}
      MAIL_PORT: ${{ vars.MAIL_PORT }}
      MAIL_SMTP_AUTH: ${{ vars.MAIL_SMTP_AUTH }}
      MAIL_SMTP_STARTTLS: ${{ vars.MAIL_SMTP_STARTTLS }}
      APP_MAIL_REGISTRATION_ENABLED: ${{ vars.APP_MAIL_REGISTRATION_ENABLED }}
      APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM }}
      APP_REGISTRATION_OTP_EXPIRE_MINUTES: ${{ vars.APP_REGISTRATION_OTP_EXPIRE_MINUTES }}
      APP_REGISTRATION_OTP_RESEND_SECONDS: ${{ vars.APP_REGISTRATION_OTP_RESEND_SECONDS }}
      APP_PAYMENT_BANK_NAME: ${{ vars.APP_PAYMENT_BANK_NAME }}
      APP_PAYMENT_BANK_BIN: ${{ vars.APP_PAYMENT_BANK_BIN }}
      APP_PAYMENT_VNPAY_DISPLAY_NAME: ${{ vars.APP_PAYMENT_VNPAY_DISPLAY_NAME }}
      APP_PAYMENT_MOMO_DISPLAY_NAME: ${{ vars.APP_PAYMENT_MOMO_DISPLAY_NAME }}
      JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
      APP_CORS_ALLOWED_ORIGIN: ${{ vars.APP_CORS_ALLOWED_ORIGIN }}
      DOCKERHUB_PROJECT_NAME: ${{ vars.DOCKERHUB_PROJECT_NAME }}
      # Outputs từ job build-and-push
      DOCKER_IMAGE: ${{ needs.build-and-push.outputs.image_full }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,DATABASE_URL,DATABASE_USERNAME,DATABASE_PASSWORD,JWT_SECRET,JWT_EXPIRATION,MAIL_USERNAME,MAIL_PASSWORD,MAIL_HOST,MAIL_PORT,MAIL_SMTP_AUTH,MAIL_SMTP_STARTTLS,APP_MAIL_REGISTRATION_ENABLED,APP_MAIL_FROM,APP_REGISTRATION_OTP_EXPIRE_MINUTES,APP_REGISTRATION_OTP_RESEND_SECONDS,APP_PAYMENT_BANK_NAME,APP_PAYMENT_BANK_BIN,APP_PAYMENT_BANK_ACCOUNT_NUMBER,APP_PAYMENT_BANK_ACCOUNT_NAME,APP_PAYMENT_VNPAY_DISPLAY_NAME,APP_PAYMENT_MOMO_DISPLAY_NAME,APP_PAYMENT_MOMO_WALLET_ID,PORT,APP_DOMAIN,HOST_PORT,CONTAINER_NAME,ENV_FILE_PATH,AWS_REGION,SSM_PARAMETER_NAME,DOCKER_IMAGE,IMAGE_TAG,APP_CORS_ALLOWED_ORIGIN,DOCKERHUB_PROJECT_NAME
          script: |
            set -e

            # 0. Thiết lập Fallback an toàn cho các biến quan trọng
            PROJECT_NAME="${DOCKERHUB_PROJECT_NAME:-newsky-backend}"
            CONTAINER_NAME="${CONTAINER_NAME:-newsky-backend}"
            HOST_PORT="${HOST_PORT:-8080}"
            PORT="${PORT:-8080}"
            ENV_FILE_PATH="${ENV_FILE_PATH:-/tmp/app.env}"

            if [ -z "$DOCKER_IMAGE" ]; then
              DOCKER_IMAGE="${DOCKERHUB_USERNAME}/${PROJECT_NAME}:${IMAGE_TAG}"
            fi

            echo "=== DEPLOYMENT INFO ==="
            echo "Container Name: $CONTAINER_NAME"
            echo "Docker Image:   $DOCKER_IMAGE"
            echo "Port Mapping:   ${HOST_PORT}:${PORT}"
            echo "======================="

            # 1. Tạo file .env tạm trên EC2 (Bọc quotes "" tránh lỗi dấu cách/ký tự đặc biệt)
            mkdir -p "$(dirname "$ENV_FILE_PATH")"
            cat > "$ENV_FILE_PATH" <<EOF
            SPRING_DATASOURCE_URL=${DATABASE_URL}
            SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
            SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
            SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
            SPRING_JPA_HIBERNATE_DDL_AUTO=none
            SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
            SPRING_JPA_HIBERNATE_NAMING_IMPLICIT_STRATEGY=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
            SPRING_JPA_SHOW_SQL=true
            SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQLDialect
            SPRING_MAIL_HOST=${MAIL_HOST}
            SPRING_MAIL_PORT=${MAIL_PORT}
            SPRING_MAIL_USERNAME=${MAIL_USERNAME}
            SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
            SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH}
            SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${MAIL_SMTP_STARTTLS}
            APP_MAIL_BRAND_NAME=NewSky English
            PORT=${PORT}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRATION=${JWT_EXPIRATION}
            APP_MAIL_REGISTRATION_ENABLED=${APP_MAIL_REGISTRATION_ENABLED}
            APP_MAIL_FROM=${APP_MAIL_FROM}
            APP_REGISTRATION_OTP_EXPIRE_MINUTES=${APP_REGISTRATION_OTP_EXPIRE_MINUTES}
            APP_REGISTRATION_OTP_RESEND_SECONDS=${APP_REGISTRATION_OTP_RESEND_SECONDS}
            APP_PAYMENT_BANK_NAME=${APP_PAYMENT_BANK_NAME}
            APP_PAYMENT_BANK_BIN=${APP_PAYMENT_BANK_BIN}
            APP_PAYMENT_BANK_ACCOUNT_NUMBER=${APP_PAYMENT_BANK_ACCOUNT_NUMBER}
            APP_PAYMENT_BANK_ACCOUNT_NAME=${APP_PAYMENT_BANK_ACCOUNT_NAME}
            APP_PAYMENT_VNPAY_DISPLAY_NAME=${APP_PAYMENT_VNPAY_DISPLAY_NAME}
            APP_PAYMENT_MOMO_DISPLAY_NAME=${APP_PAYMENT_MOMO_DISPLAY_NAME}
            APP_PAYMENT_MOMO_WALLET_ID=${APP_PAYMENT_MOMO_WALLET_ID}
            APP_CORS_ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
            EOF

            # 2. Login DockerHub và pull image mới
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$DOCKER_IMAGE"

            # 3. Dừng và xoá container cũ nếu đang chạy
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            # 4. Chạy container mới
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart=always \
              -p "${HOST_PORT}:${PORT}" \
              --env-file "$ENV_FILE_PATH" \
              "$DOCKER_IMAGE"

            # 5. Xoá file .env sau khi container đã đọc xong
            rm -f "$ENV_FILE_PATH"

            # 6. Update SSM Parameter (image tag mới) để Auto Scaling Group nhận phiên bản mới
            export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            export AWS_DEFAULT_REGION="$AWS_REGION"

            aws ssm put-parameter \
              --name "$SSM_PARAMETER_NAME" \
              --value "$IMAGE_TAG" \
              --type "String" \
              --overwrite

            echo "Deploy completed successfully for tag: $IMAGE_TAG"
